[project]
name = "propledger-quebec"
version = "0.1.0"
description = "Proprietary property-data intelligence platform for Québec municipal assessment rolls"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Themba Ngxola" }]
readme = "README.md"
dependencies = [
    "lxml>=5.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "polars>=1.0",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "structlog>=24.1",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-pyyaml>=6.0",
    "bandit[toml]>=1.7",
    "pip-audit>=2.7",
    "pre-commit>=3.7",
    "commitizen>=3.27",
    "detect-secrets>=1.5",
]

[project.scripts]
propledger = "propledger.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/propledger"]

# ---------- Ruff ----------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["configurations", "migrations/versions", "data"]

[tool.ruff.lint]
select = ["E","W","F","I","B","C4","UP","N","S","T20","SIM","RUF","PT","TID","PL"]
ignore = ["PLR0913", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]
"src/propledger/cli.py" = ["T201"]

[tool.ruff.lint.isort]
known-first-party = ["propledger"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------- Mypy ----------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/versions"]

[[tool.mypy.overrides]]
module = ["lxml.*"]
ignore_missing_imports = true

# ---------- Pytest ----------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--cov=propledger",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-fail-under=85",
]
markers = [
    "unit: fast, no I/O",
    "integration: touches DB or filesystem",
    "slow: >5s",
]

# ---------- Coverage ----------
[tool.coverage.run]
branch = true
source = ["src/propledger"]
omit = [
    "*/migrations/*",
    "*/api/main.py",
    "*/api/deps_plan.py",
    "*/cli.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

# ---------- Bandit ----------
[tool.bandit]
exclude_dirs = ["tests", "migrations"]
skips = ["B101"]

# ---------- Commitizen ----------
[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "pep440"
version_provider = "pep621"
update_changelog_on_bump = true
major_version_zero = true
changelog_incremental = true
changelog_start_rev = "v0.1.0"
